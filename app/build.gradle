plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'org.jlleitschuh.gradle.ktlint'
}

ktlint {
    android = true
    outputToConsole = true
    ignoreFailures = false
}

android {
    namespace 'kontestbuddybyamitmaity.example.kontestbuddy'
    compileSdk 36

    defaultConfig {
        applicationId "kontestbuddybyamitmaity.example.kontestbuddy"
        minSdk 24
        targetSdk 36
        versionCode 16
        versionName "2.0.001_V2_Fr_QNSTAT_04"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

//    implementation 'org.jsoup:jsoup:1.14.3'
//    implementation 'com.android.volley:volley:1.2.1'


    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-database-ktx:21.0.0'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.0.0'
//    implementation 'com.google.firebase:firebase-storage-ktx:20.3.0'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-analytics'

//    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'androidx.test:core-ktx:1.6.1'

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation 'io.github.jan-tennert.supabase-kt:supabase-kt:0.8.0'
    implementation 'io.github.jan-tennert.supabase-kt:postgrest-kt:0.8.0'

    implementation 'io.ktor:ktor-client-core:2.3.12'
    implementation 'io.ktor:ktor-client-cio:2.3.12'
    implementation 'io.ktor:ktor-client-serialization:2.3.12'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

